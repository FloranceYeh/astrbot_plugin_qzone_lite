name: astrbot_plugin_qzone_lite
display_name: QQ空间Lite
desc: QQ空间轻量插件，支持查看/发表/评论说说与回复评论，适合轻量部署场景
help: |
  命令列表：
  - 看说说 [@用户] [序号/范围]
  - 发说说 <文本> [图片]（管理员）
  - 评说说 [@用户] [序号/范围] <评论内容>
  - 回评 [@用户] [说说序号] [评论序号] <回复内容>
version: v1.6.0
author: Florance
repo: https://github.com/FloranceYeh/astrbot_plugin_qzone_lite
